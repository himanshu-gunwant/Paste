name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Express + TypeScript + Prisma)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://paste:paste_dev_password@127.0.0.1:5432/paste?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      RUN_INTEGRATION: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: paste
          POSTGRES_PASSWORD: paste_dev_password
          POSTGRES_DB: paste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paste"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mailhog:
        image: mailhog/mailhog:latest
        ports:
          - 1025:1025
          - 8025:8025

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run unit & integration tests
        run: npm test

      - name: Build backend bundle
        run: npm run build

  frontend:
    name: Frontend (Next.js 15 + React 19)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint Next.js application
        run: npm run lint

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          BACKEND_URL: http://localhost:3000

name: Bug Report
description: Create a report to help us fix a bug or unexpected behavior
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and fix it quickly.
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the project is affected?
      options:
        - Frontend (Next.js Web UI)
        - Backend (API Server)
        - Background Worker (BullMQ)
        - Deployment / Docker Compose
        - Documentation
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please share your environment details (Node version, OS, browser, Docker).
      placeholder: |
        - OS: Windows 11 / Ubuntu 22.04 / macOS
        - Node Version: v22.x
        - Browser: Chrome 130 / Firefox 132
